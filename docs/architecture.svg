<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">MSI keyboard backlight idle architecture</title>
  <desc id="desc">A key resets a timer. After the idle timeout, a HID feature report sets keyboard brightness to off. The next key restores the saved level. The color effect is left unchanged.</desc>
  <rect width="960" height="560" fill="#f7f6f3"/>
  <text x="40" y="42" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Keyboard idle backlight</text>
  <text x="40" y="68" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">Windows session. Brightness only. The Mystic Light color effect stays as it is.</text>

  <rect x="40" y="100" width="200" height="78" rx="10" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="56" y="130" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Any key</text>
  <text x="56" y="152" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">Low-level keyboard hook.</text>
  <text x="56" y="168" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">Mouse does not count.</text>

  <rect x="300" y="100" width="230" height="78" rx="10" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="316" y="130" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Idle timer</text>
  <text x="316" y="152" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">config.json</text>
  <text x="316" y="168" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">timeout_seconds, default 120</text>

  <rect x="590" y="100" width="330" height="78" rx="10" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="606" y="130" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Evening window</text>
  <text x="606" y="152" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">18:00–08:00, level 1 until the</text>
  <text x="606" y="168" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">first key. Both hours are settings.</text>

  <path d="M140 178 V214 H415 V230" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M415 178 V214" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M755 178 V214 H415" fill="none" stroke="#a8a29e" stroke-width="1.5"/>

  <rect x="250" y="230" width="460" height="92" rx="10" fill="#1c1917"/>
  <text x="270" y="258" fill="#fafaf9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">One decision</text>
  <text x="270" y="282" fill="#d6d3d1" font-family="Segoe UI, sans-serif" font-size="13">Idle long enough: remember the level, then set brightness 0.</text>
  <text x="270" y="302" fill="#d6d3d1" font-family="Segoe UI, sans-serif" font-size="13">Next key: write the saved level back. A key during the write cancels it.</text>

  <path d="M480 322 V358" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M480 358 l-4 -8 h8 z" fill="#a8a29e"/>

  <rect x="170" y="366" width="620" height="78" rx="10" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="186" y="396" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">HID feature report, 64 bytes, report id 1</text>
  <text x="186" y="418" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">Command 176 writes a level. Command 177 reads it. Levels are 0 off, then 1–4.</text>

  <path d="M480 444 V478" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M480 478 l-4 -8 h8 z" fill="#a8a29e"/>

  <rect x="170" y="486" width="620" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="186" y="518" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">USB 0DB0:1605 · MSI Center name “26 Zone” · product id, not a serial number</text>
</svg>
